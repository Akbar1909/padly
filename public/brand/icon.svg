<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <!--
    Padly app icon: a product centred inside a dashed selection frame with even padding
    ("pad, never crop"). Colours are the landing palette: ink, paper, safety orange.
    Full-bleed square on purpose: the App Store and iOS round the corners themselves.
    The frame is 820 px wide with a 90 px stroke; one dash period (238 + 172) is exactly
    half a side, and the half-dash offset puts an L-shaped dash on every corner.
    Rendered to icon-1200.png, /apple-touch-icon.png and /favicon.ico (commands in docs/app-store/brand-src/icon.html).
  -->
  <title>Padly</title>
  <rect width="1200" height="1200" fill="#16130f"/>
  <rect x="190" y="190" width="820" height="820" fill="none" stroke="#ff5a1f" stroke-width="90"
        stroke-dasharray="238 172" stroke-dashoffset="119"/>
  <!-- Bottle: 70 px from the frame at the top and bottom, centred left to right. -->
  <g fill="#f3efe6">
    <rect x="522" y="305" width="156" height="106" rx="22"/>
    <rect x="546" y="400" width="108" height="80"/>
    <rect x="393" y="446" width="414" height="449" rx="83"/>
  </g>
</svg>
